<style>
  /* First paint, before the stylesheet arrives: the right background and the mark. */
  html { background: #f2f2f7; }
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f2f2f7; color: #0b0b0d; transition: opacity 0.4s ease; }
  #splash svg { width: 84px; height: 84px; }
  #splash.gone { opacity: 0; pointer-events: none; }
  @media (prefers-color-scheme: dark) {
    html, #splash { background: #000; }
    #splash { color: #f5f5f7; }
  }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 512 512" fill="none" stroke-width="46" stroke-linecap="round">
    <g transform="rotate(-90 256 256)">
      <circle cx="256" cy="256" r="118" stroke="#34d27b" stroke-dasharray="313.5 9999" stroke-dashoffset="-36"/>
      <circle cx="256" cy="256" r="118" stroke="currentColor" stroke-dasharray="150.4 9999" stroke-dashoffset="-421.5"/>
      <circle cx="256" cy="256" r="118" stroke="#77777d" stroke-dasharray="61.5 9999" stroke-dashoffset="-644"/>
    </g>
  </svg>
</div>

<div id="app">
  <div id="page">
    <div class="glow up" aria-hidden="true"></div>
    <div class="glow down" aria-hidden="true"></div>

    <div class="nav" id="nav" aria-hidden="true">
      <span class="nav-title" id="nav-title"></span>
    </div>

    <main class="scroll" id="scroll">
      <div class="ptr" id="ptr" aria-hidden="true"><span class="spinner"></span></div>

      <div class="shell">
        <header class="top">
          <h1 class="brand">Portfolio <span class="live" id="live" title=""></span></h1>
          <div class="top-actions">
            <button class="icon-btn" id="btn-settings" type="button" aria-label="Ajustes"></button>
            <button class="icon-btn solid" id="btn-add" type="button" aria-label="Añadir activo"></button>
          </div>
        </header>

        <section class="hero" id="hero" aria-label="Balance total">
          <button class="balance" id="balance" type="button" aria-label="Balance. Toca para cambiar de unidad, mantén pulsado para ocultarlo">
            <span class="roller" id="roller"></span>
          </button>
          <button class="pill" id="change" type="button" hidden></button>
        </section>

        <section class="home-chart" id="home-chart" hidden aria-label="Evolución">
          <div class="pchart" id="pchart"></div>
          <p class="chart-empty" id="chart-empty" hidden>El historial real se llena solo, cada vez que abres la app.</p>
          <div id="prange"></div>
          <button class="chart-note" id="chart-note" type="button" hidden></button>
        </section>

        <section class="alloc" id="alloc" hidden aria-label="Distribución">
          <div class="alloc-bar" id="alloc-bar"></div>
          <div class="alloc-bar target" id="alloc-target" hidden aria-label="Distribución objetivo"></div>
          <div class="alloc-legend" id="alloc-legend">
            <button class="chip ghost" id="btn-targets" type="button">Objetivo</button>
          </div>
        </section>

        <div class="notice" id="notice" hidden></div>

        <section class="card list" id="list" aria-label="Activos"></section>

        <section class="empty" id="empty" hidden>
          <div class="empty-logos" id="empty-logos"></div>
          <h2>Todo tu patrimonio, en vivo</h2>
          <p>Crypto, acciones, metales y efectivo en un solo balance.</p>
          <button class="btn-primary" id="empty-add" type="button">Añadir activo</button>
          <button class="btn-text" id="empty-restore" type="button" hidden>Restaurar copia</button>
          <button class="btn-text" id="empty-demo" type="button">Ver un ejemplo</button>
        </section>

        <div class="demo-bar" id="demo-bar" hidden>
          <span>Ejemplo</span>
          <button class="btn-text" id="demo-exit" type="button">Salir</button>
        </div>
      </div>
    </main>
  </div>

  <div id="sheets"></div>
  <div id="toasts"></div>
</div>

<noscript><p style="padding:24px;font-family:system-ui">Esta app necesita JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
